  },
  {

    title: "Empfehlung geben",
    context: 'Ein Gast fragt: "Was können Sie empfehlen?"',
    prompt: "Wie reagierst du?",
    speaker: "Kellner/in",
    options: [
      {
        text: "Ich kann Ihnen das Gemüse-Curry empfehlen, das ist heute unser Tagesgericht.",
        correct: true,
        feedbackCorrect: "Sehr gut: konkrete Empfehlung mit Zusatzinformation.",
        feedbackWrong: "Gib eine konkrete Empfehlung und erkläre kurz, warum."

  },
  {

    speaker: "Kellner/in",
    options: [
      {
        text: "Natürlich, möchten Sie statt Pommes einen Salat oder etwas anderes?",

let currentRole = 'gast';
let answered = {};
let correctAnswers = 0;

const activityContainer = document.getElementById('activity');
const correctCountEl = document.getElementById('correctCount');
const totalCountEl = document.getElementById('totalCount');
const scoreFillEl = document.getElementById('scoreFill');
const summaryTextEl = document.getElementById('summaryText');

function getScenes() {
  return currentRole === 'gast' ? scenesGast : scenesKellner;
}

function renderActivity() {
  const scenes = getScenes();
  activityContainer.innerHTML = '';
  answered = {};
  correctAnswers = 0;
  updateSummary();

  scenes.forEach(scene => {
    const sceneDiv = document.createElement('div');
    sceneDiv.className = 'scene';

    const title = document.createElement('h2');
    title.textContent = scene.id + '. ' + scene.title;
    sceneDiv.appendChild(title);

    const context = document.createElement('p');
    context.className = 'context';
    context.textContent = scene.context;
    sceneDiv.appendChild(context);

    const dialogue = document.createElement('div');
    dialogue.className = 'dialogue';

    const roleP = document.createElement('p');
    roleP.innerHTML = '<span class="role">' + scene.speaker + ':</span> ' + scene.prompt;
    dialogue.appendChild(roleP);

    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';

    scene.options.forEach((option, index) => {
      const button = document.createElement('button');
      button.textContent = option.text;
      button.addEventListener('click', () => handleAnswer(scene.id, index, button, scene));
      optionsDiv.appendChild(button);
    });

    dialogue.appendChild(optionsDiv);

    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback';
    feedbackDiv.id = 'feedback-' + scene.id;
    dialogue.appendChild(feedbackDiv);

    const progressP = document.createElement('p');
    progressP.className = 'progress';
    progressP.id = 'progress-' + scene.id;
    dialogue.appendChild(progressP);

    sceneDiv.appendChild(dialogue);
    activityContainer.appendChild(sceneDiv);
  });

  totalCountEl.textContent = scenes.length;
}

function handleAnswer(sceneId, optionIndex, button, scene) {
  const alreadyAnswered = answered[sceneId];
  const feedbackDiv = document.getElementById('feedback-' + sceneId);
  const progressP = document.getElementById('progress-' + sceneId);

  if (!alreadyAnswered) {
    answered[sceneId] = { chosen: optionIndex, correct: scene.options[optionIndex].correct };
    if (scene.options[optionIndex].correct) {
      correctAnswers++;
    }
  } else {
    return;
  }

  const buttons = button.parentElement.querySelectorAll('button');
  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (scene.options[idx].correct) {
      btn.classList.add('correct');
    } else if (idx === optionIndex) {
      btn.classList.add('incorrect');
    }
  });

  const chosen = scene.options[optionIndex];
  if (chosen.correct) {
    feedbackDiv.textContent = chosen.feedbackCorrect || 'Richtig! Gut gemacht.';
    feedbackDiv.className = 'feedback correct';
  } else {
    const correctOption = scene.options.find(o => o.correct);
    feedbackDiv.textContent = (chosen.feedbackWrong || 'Nicht ganz.') + ' Besser wäre: "' + correctOption.text + '"';
    feedbackDiv.className = 'feedback incorrect';
  }

  const scenes = getScenes();
  progressP.textContent = 'Szene ' + scene.id + ' von ' + scenes.length + ' – abgeschlossen.';

  updateSummary();
}

function updateSummary() {
  const scenes = getScenes();
  const total = scenes.length;
  const answeredCount = Object.keys(answered).length;
  const percent = total > 0 ? Math.round((correctAnswers / total) * 100) : 0;

  correctCountEl.textContent = correctAnswers;
  totalCountEl.textContent = total;
  scoreFillEl.style.width = percent + '%';

  if (answeredCount === 0) {
    summaryTextEl.textContent = 'Wähle eine Rolle und beginne mit Szene 1.';
  } else if (answeredCount < total) {
    summaryTextEl.textContent = 'Gut! Du hast bereits ' + answeredCount + ' von ' + total + ' Situationen bearbeitet.';
  } else {
    let text = 'Super! Du hast alle Situationen als ' + (currentRole === 'gast' ? 'Gast' : 'Kellner/in') + ' gespielt.';
    if (percent === 100) {
      text += ' Alle Formulierungen waren sehr passend!';
    } else if (percent >= 60) {
      text += ' Viele deiner Formulierungen sind schon sehr natürlich.';
    } else {
      text += ' Schau dir die Verbesserungsvorschläge an und spiele die Szene noch einmal.';
    }
    summaryTextEl.textContent = text;
  }
}

// Role switching
const roleSelect = document.getElementById('roleSelect');
if (roleSelect) {
  roleSelect.addEventListener('change', () => {
    currentRole = roleSelect.value;
    renderActivity();
  });
}

// Menu toggle
const menuToggle = document.getElementById('menuToggle');
const menu = document.getElementById('menu');
if (menuToggle && menu) {
  menuToggle.addEventListener('click', () => {
    const visible = menu.style.display === 'block';
    menu.style.display = visible ? 'none' : 'block';
    menuToggle.textContent = visible ? 'Speisekarte anzeigen' : 'Speisekarte ausblenden';
    menu.setAttribute('aria-hidden', visible ? 'true' : 'false');
  });
}

// Initial render
renderActivity();

// Generiere einen einfachen Code, der das Ergebnis zusammenfasst
function generateResultCode() {
  const role = currentRole === 'gast' ? 'GAST' : 'KELLNER';
  const scenes = getScenes();
  const total = scenes.length;
  const percent = total > 0 ? Math.round((correctAnswers / total) * 100) : 0;
  const code = role + '-' + correctAnswers + 'v' + total + '-' + percent + 'P';
  const codeEl = document.getElementById('resultCode');
  if (codeEl) {
    codeEl.textContent = code;
  }
}

// Aktualisiere den Code immer, wenn sich das Ergebnis ändert
const originalUpdateSummary = updateSummary;
updateSummary = function() {
  originalUpdateSummary();
  generateResultCode();
};

// Ersten Code direkt nach dem Laden setzen
window.addEventListener('load', generateResultCode);
</script>
